openapi: 3.1.0
info:
  title: AI QA Interview Coach API
  version: 0.1.0
  description: Initial MVP contract for interview practice, feedback, CRI and diary flows.
servers:
  - url: http://localhost:3001/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /auth/login:
    post:
      summary: Login personal user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/me:
    get:
      summary: Get authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid token
  /dashboard:
    get:
      summary: Get initial dashboard data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Missing or invalid token
  /interviews:
    post:
      summary: Start interview session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInterviewRequest"
      responses:
        "201":
          description: Interview session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
  /interviews/{sessionId}/answers:
    post:
      summary: Submit interview answer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "201":
          description: Answer registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
  /interviews/{sessionId}/complete:
    post:
      summary: Complete interview session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "201":
          description: Interview session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
  /grill-me/sessions:
    post:
      summary: Start a Grill Me session with optional job context
      description: When opportunityId is supplied, the owned vacancy and its persisted analysis ground the opening question and follow-ups.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGrillMeRequest"
      responses:
        "201":
          description: Grill Me session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillMeResponse"
        "404":
          description: Question or owned opportunity not found
  /grill-me/sessions/{sessionId}/answers:
    post:
      summary: Answer a Grill Me question and generate the next vacancy-grounded follow-up
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitGrillMeAnswerRequest"
      responses:
        "201":
          description: Answer recorded and session advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillMeResponse"
        "404":
          description: Grill Me session not found for the authenticated user
  /learning/hint:
    post:
      summary: Request progressive help
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningHintRequest"
      responses:
        "200":
          description: Hint returned
  /cri/current:
    get:
      summary: Get current Career Readiness Index
      responses:
        "200":
          description: Current CRI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriSnapshot"
  /diary/entries:
    get:
      summary: List diary entries
      responses:
        "200":
          description: Diary entries
    post:
      summary: Create diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntry"
      responses:
        "201":
          description: Diary entry created
  /job-opportunities:
    get:
      summary: List manually registered job opportunities
      description: Returns only opportunities owned by the authenticated user. No scraping or external source is called.
      security:
        - bearerAuth: []
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/JobStatus" } }
        - { name: workModel, in: query, schema: { $ref: "#/components/schemas/WorkModel" } }
        - { name: seniority, in: query, schema: { type: string } }
        - { name: favorite, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Filtered opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobOpportunity"
        "401":
          description: Missing or invalid token
    post:
      summary: Create a job opportunity manually
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobOpportunity"
      responses:
        "201":
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOpportunity"
        "400":
          description: Invalid manual input
        "401":
          description: Missing or invalid token
  /job-opportunities/{opportunityId}:
    parameters:
      - $ref: "#/components/parameters/OpportunityId"
    get:
      summary: Get a job opportunity detail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOpportunity"
        "404":
          description: Opportunity not found for the authenticated user
    patch:
      summary: Update a job opportunity manually
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobOpportunity"
      responses:
        "200":
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOpportunity"
        "400":
          description: Invalid manual input
        "404":
          description: Opportunity not found for the authenticated user
    delete:
      summary: Delete a job opportunity
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Opportunity deleted
        "404":
          description: Opportunity not found for the authenticated user
  /jobs/{opportunityId}/analyze:
    post:
      summary: Generate and persist a structured job analysis
      description: Uses the configured AI provider with deterministic mock fallback and validates the structured response before persistence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "201":
          description: Analysis generated or replaced for the opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAnalysis"
        "401":
          description: Missing or invalid token
        "404":
          description: Opportunity not found for the authenticated user
        "502":
          description: AI response could not be validated and no invalid result was persisted
  /job-applications:
    get:
      summary: List manually tracked job applications
      description: Returns only applications owned by the authenticated user, including their job opportunity.
      security:
        - bearerAuth: []
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApplicationStatus" } }
      responses:
        "200":
          description: Filtered applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"
        "401":
          description: Missing or invalid token
    post:
      summary: Add a job opportunity to the manual application pipeline
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobApplication"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
        "400":
          description: Invalid input or opportunity already tracked
        "404":
          description: Opportunity not found for the authenticated user
  /job-applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      summary: Get an application detail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
        "404":
          description: Application not found for the authenticated user
    patch:
      summary: Update an application stage, dates, next action or notes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobApplication"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
        "400":
          description: Invalid input
        "404":
          description: Application not found for the authenticated user
    delete:
      summary: Remove an application from the pipeline without deleting its opportunity
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Application removed
        "404":
          description: Application not found for the authenticated user
  /career-documents:
    get:
      summary: List saved vacancy-targeted career document packs
      description: Returns only packs owned by the authenticated user, optionally filtered by opportunity.
      security:
        - bearerAuth: []
      parameters:
        - name: opportunityId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Career document packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerDocument"
        "401":
          description: Missing or invalid token
  /career-documents/generate:
    post:
      summary: Generate or replace one career document pack for a vacancy and language
      description: Uses only supplied professional evidence. The deterministic mock is the zero-cost default; Ollama is optional. Output is schema- and evidence-validated before persistence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCareerDocumentRequest"
      responses:
        "201":
          description: Generated and persisted pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerDocument"
        "400":
          description: Invalid language or insufficient professional evidence
        "404":
          description: Opportunity not found for the authenticated user
        "502":
          description: AI response failed schema or evidence validation and was not persisted
  /career-documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      summary: Get a saved career document pack
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Career document pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerDocument"
        "404":
          description: Document not found for the authenticated user
    delete:
      summary: Delete a saved career document pack
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Document deleted
        "404":
          description: Document not found for the authenticated user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    StartInterviewRequest:
      type: object
      required: [language, targetRole, seniority, topic, difficulty]
      properties:
        language:
          type: string
          enum: [pt-BR, en]
        targetRole:
          type: string
        seniority:
          type: string
        topic:
          type: string
        difficulty:
          type: string
          enum: [medium, advanced, specialist]
        interviewerStyle:
          type: string
    InterviewSession:
      type: object
      properties:
        id:
          type: string
        language:
          type: string
        status:
          type: string
        currentQuestion:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/InterviewTurn"
    InterviewTurn:
      type: object
      properties:
        orderIndex:
          type: number
        question:
          type: string
        answer:
          type: string
        coachNote:
          type: string
    SubmitAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
    StartGrillMeRequest:
      type: object
      required: [topic, language, level, mode]
      properties:
        topic: { type: string }
        language: { type: string, enum: [pt-BR, en] }
        level: { type: string, enum: [basic, intermediate, advanced] }
        mode: { type: string, enum: [standard, light-pressure, realistic] }
        targetRole: { type: string }
        opportunityId: { type: string, format: uuid }
    SubmitGrillMeAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
        helpUsed: { type: boolean }
    GrillMeResponse:
      type: object
      required: [mode, session]
      properties:
        mode: { type: string, enum: [standard, light-pressure, realistic] }
        level: { type: string, enum: [basic, intermediate, advanced] }
        sourceQuestion: { type: object }
        attempt: { type: [object, "null"] }
        jobContext:
          type: object
          required: [id, title, company]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            company: { type: string }
        session:
          $ref: "#/components/schemas/InterviewSession"
    FeedbackReport:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        confidenceLevel:
          type: string
          enum: [low, medium, high]
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackDimension"
    FeedbackDimension:
      type: object
      properties:
        name:
          type: string
        score:
          type: number
        evidence:
          type: string
        recommendation:
          type: string
    LearningHintRequest:
      type: object
      required: [language, helpLevel, userAnswer]
      properties:
        language:
          type: string
          enum: [pt-BR, en]
        helpLevel:
          type: string
          enum: [brief-hint, guidance, structure, commented-answer]
        userAnswer:
          type: string
        concept:
          type: string
    CriSnapshot:
      type: object
      properties:
        score:
          type: number
        confidenceLevel:
          type: string
        composition:
          type: object
        evidenceGaps:
          type: array
          items:
            type: string
    DiaryEntry:
      type: object
      properties:
        id:
          type: string
        entryType:
          type: string
        title:
          type: string
        context:
          type: string
        decision:
          type: string
        nextSteps:
          type: string
    Dashboard:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        cri:
          type: object
        interviewReadiness:
          type: object
        competencies:
          type: array
          items:
            type: object
        shortcuts:
          type: array
          items:
            type: object
    JobStatus:
      type: string
      enum: [saved, applied, interviewing, offer, rejected, archived]
    WorkModel:
      type: string
      enum: [remote, hybrid, onsite]
    CreateJobOpportunity:
      type: object
      required: [title, company, country, workModel, seniority, language, originalDescription]
      properties:
        title: { type: string, minLength: 1 }
        company: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        city: { type: string }
        workModel: { $ref: "#/components/schemas/WorkModel" }
        seniority: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        link: { type: string, format: uri }
        originalDescription: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/JobStatus" }
        favorite: { type: boolean, default: false }
        notes: { type: string }
    UpdateJobOpportunity:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        company: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        city: { type: string }
        workModel: { $ref: "#/components/schemas/WorkModel" }
        seniority: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        link: { type: string, format: uri }
        originalDescription: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/JobStatus" }
        favorite: { type: boolean }
        notes: { type: string }
    JobOpportunity:
      allOf:
        - $ref: "#/components/schemas/CreateJobOpportunity"
        - type: object
          required: [id, userId, status, favorite, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            userId: { type: string }
            city: { type: [string, "null"] }
            link: { type: [string, "null"], format: uri }
            notes: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            analysis:
              oneOf:
                - $ref: "#/components/schemas/JobAnalysis"
                - type: "null"
            application:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
                - type: "null"
    JobAnalysis:
      type: object
      required: [id, opportunityId, technicalSummary, responsibilities, requiredRequirements, preferredRequirements, technologies, softSkills, estimatedSeniority, profileFit, gaps, preparationPlan, providerName, modelName, promptTemplateVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        opportunityId: { type: string, format: uuid }
        technicalSummary: { type: string }
        responsibilities: { type: array, items: { type: string } }
        requiredRequirements: { type: array, items: { type: string } }
        preferredRequirements: { type: array, items: { type: string } }
        technologies: { type: array, items: { type: string } }
        softSkills: { type: array, items: { type: string } }
        estimatedSeniority: { type: string }
        profileFit:
          type: object
          required: [score, summary, evidence]
          properties:
            score: { type: number, minimum: 0, maximum: 100 }
            summary: { type: string }
            evidence: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        preparationPlan:
          type: array
          items:
            type: object
            required: [priority, action, rationale]
            properties:
              priority: { type: string, enum: [high, medium, low] }
              action: { type: string }
              rationale: { type: string }
        providerName: { type: string }
        modelName: { type: string }
        promptTemplateVersion: { type: string, example: "career.job-analysis@1.0.0" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationStatus:
      type: string
      enum: [planned, applied, screening, interview, technical, offer, hired, rejected, withdrawn]
    CreateJobApplication:
      type: object
      required: [opportunityId]
      properties:
        opportunityId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        appliedAt: { type: [string, "null"], format: date-time }
        nextAction: { type: [string, "null"] }
        nextActionAt: { type: [string, "null"], format: date-time }
        notes: { type: [string, "null"] }
    UpdateJobApplication:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        appliedAt: { type: [string, "null"], format: date-time }
        nextAction: { type: [string, "null"] }
        nextActionAt: { type: [string, "null"], format: date-time }
        notes: { type: [string, "null"] }
    JobApplication:
      allOf:
        - $ref: "#/components/schemas/CreateJobApplication"
        - type: object
          required: [id, status, opportunity, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            opportunity:
              $ref: "#/components/schemas/JobOpportunity"
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CareerDocumentLanguage:
      type: string
      enum: [pt-BR, en]
    GenerateCareerDocumentRequest:
      type: object
      required: [opportunityId, language, candidateProfile]
      properties:
        opportunityId: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/CareerDocumentLanguage" }
        candidateProfile: { type: string, minLength: 40, maxLength: 20000 }
    FitMatrixItem:
      type: object
      required: [requirement, evidence, status]
      properties:
        requirement: { type: string }
        evidence: { type: string }
        status: { type: string, enum: [supported, partial, gap] }
    CareerDocument:
      type: object
      required: [id, opportunityId, language, candidateProfile, cvMarkdown, coverLetter, fitMatrix, providerName, modelName, promptTemplateVersion, opportunity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        opportunityId: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/CareerDocumentLanguage" }
        candidateProfile: { type: string }
        cvMarkdown: { type: string }
        coverLetter: { type: string }
        fitMatrix:
          type: array
          items: { $ref: "#/components/schemas/FitMatrixItem" }
        providerName: { type: string }
        modelName: { type: string }
        promptTemplateVersion: { type: string, example: "career.document-pack@2.0.0" }
        opportunity: { $ref: "#/components/schemas/JobOpportunity" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
